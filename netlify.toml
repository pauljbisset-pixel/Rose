[build]
  publish = "."
  functions = "netlify/functions"
  # Rewrites js/config.js from environment variables before publishing, so
  # no credential — not even the "safe to expose" read-only Airtable token —
  # is ever committed to git. See scripts/build-config.js and SETUP.md.
  command = "node scripts/build-config.js"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# dashboard.html is not linked from public navigation and gates its
# own content behind Netlify Identity + the paintings/enquiries
# functions, so no path-level redirect rules are required here.
